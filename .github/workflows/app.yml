name: Build phone apps
on:
  push:
    branches: [main, claude/focused-gauss-c0ead6]
    paths: ["app/**", "index.html", "privacy.html", "terms.html", "support.html", "art/**", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build test APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sniffd-android-test
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
  # Google Play build (.aab), signed with the upload key from GitHub secrets. Skipped until the secrets exist.
  android-play:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 21 }
      - name: Copy the site into the app
        if: env.HAS_KEY == 'true'
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build the signed Play bundle
        if: env.HAS_KEY == 'true'
        working-directory: app/android
        env:
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        if: env.HAS_KEY == 'true'
        with:
          name: sniffd-play-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
      - name: No upload key yet
        if: env.HAS_KEY != 'true'
        run: echo "Add the ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD secrets to build the Play bundle."
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync ios
      - name: Build for the iPhone simulator (no signing yet)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -60
  # iPhone: signed build uploaded to TestFlight. Main branch only; skipped until the Apple key secrets exist.
  ios-testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' }}
      TEAM_ID: 78587M6AT4
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with: { node-version: 22 }
      - name: Copy the site into the app
        if: env.HAS_KEY == 'true'
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync ios
      - name: Archive, sign and upload to TestFlight
        if: env.HAS_KEY == 'true'
        working-directory: app/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Sniffd.xcarchive" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive | tail -80
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sniffd.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -60
          rm -f "$KEY_PATH"
      - name: No Apple key yet
        if: env.HAS_KEY != 'true'
        run: echo "Add the APPSTORE_KEY_ID, APPSTORE_ISSUER_ID and APPSTORE_KEY_P8 secrets to upload iPhone builds."
