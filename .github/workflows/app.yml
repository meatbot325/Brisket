name: Build phone apps
on:
  push:
    branches: [main, claude/focused-gauss-c0ead6]
    paths: ["app/**", "index.html", "privacy.html", "terms.html", "support.html", "art/**", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build test APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sniffd-android-test
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync ios
      - name: Build for the iPhone simulator (no signing yet)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -60
