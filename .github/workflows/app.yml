name: Build phone apps
on:
  push:
    branches: [main, claude/focused-gauss-c0ead6]
    paths: ["app/**", "index.html", "privacy.html", "terms.html", "support.html", "art/**", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build test APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sniffd-android-test
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
  # Google Play build (.aab), signed with the upload key from GitHub secrets. Skipped until the secrets exist.
  android-play:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 21 }
      - name: Copy the site into the app
        if: env.HAS_KEY == 'true'
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build the signed Play bundle
        if: env.HAS_KEY == 'true'
        working-directory: app/android
        env:
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        if: env.HAS_KEY == 'true'
        with:
          name: sniffd-play-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
      - name: No upload key yet
        if: env.HAS_KEY != 'true'
        run: echo "Add the ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD secrets to build the Play bundle."
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Copy the site into the app
        working-directory: app
        run: npm ci && node copy-web.mjs && npx cap sync ios
      - name: Build for the iPhone simulator (no signing yet)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -60
